name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check vendored pyncm
        shell: pwsh
        run: |
          if (-not (Test-Path vendor/pyncm/__init__.py)) {
            throw "vendor/pyncm/__init__.py not found. pyncm was removed from PyPI; copy your local pyncm package folder into vendor/pyncm."
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # pyncm 已从 PyPI 撤下，改用仓库内 vendor/pyncm；其余依赖照常安装
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^\s*pyncm' } | Set-Content requirements-ci.txt
          pip install -r requirements-ci.txt pyinstaller pycryptodome pycryptodomex

      - name: Import check
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: vendor
        run: python -c "import pyncm, qt6_player.main_window; print('import ok', pyncm.__file__)"

      - name: Build exe
        env:
          PYTHONPATH: vendor
        run: pyinstaller Klang.spec --noconfirm

      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Klang.exe)) { throw "dist/Klang.exe was not produced" }
          Get-Item dist/Klang.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Klang-windows-exe
          path: dist/Klang.exe
          if-no-files-found: error

  build-winui:
    name: Build WinUI 3 app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: >
          dotnet publish Klang.WinUI/Klang.WinUI.csproj
          -c Release -r win-x64 -p:Platform=x64
          -o publish/Klang.WinUI

      - name: Verify output
        shell: pwsh
        run: |
          foreach ($f in "Klang.WinUI.exe", "Klang.WinUI.pri") {
            if (-not (Test-Path "publish/Klang.WinUI/$f")) { throw "$f was not produced" }
          }
          Get-Item publish/Klang.WinUI/Klang.WinUI.exe | Select-Object Name, Length

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/Klang.WinUI/* -DestinationPath Klang-WinUI-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Klang-WinUI-win-x64
          path: Klang-WinUI-win-x64.zip
          if-no-files-found: error
